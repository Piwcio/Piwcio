<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="495" viewBox="0 0 1200 495" role="img" aria-labelledby="title description">
  <title id="title">Paweł Piwowar · Cloud DevOps Engineer</title>
  <desc id="description">From Amiga and PC building through IT support and system administration to DevOps. A board shows Grafana, Terraform, n8n, Azure Bicep, IONOS Cloud and four local models on an RTX 5080: Gemma 4, North Mini Code, Mellum and Bielik. Whisper and Granite are planned for voice control.</desc>
  <style>
    svg {
      --background: #f4f7f2;
      --surface: #ffffff;
      --inset: #e7efe6;
      --text: #1b2922;
      --muted: #46594f;
      --border: #c6d4c9;
      --grid: #dbe6dc;
      --sage: #2f6e4a;
      --blue: #416f9a;
      --warm: #865917;
      --lavender: #6c5a91;
    }

    text { font-family: Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: var(--text); }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .name { font-size: 71px; font-weight: 700; letter-spacing: -2.8px; }
    .role { font-size: 30px; font-weight: 600; fill: var(--sage); }
    .career { font-size: 16px; fill: var(--muted); }
    .panel { fill: var(--surface); fill-opacity: .86; stroke: var(--border); }
    .tile { fill: var(--inset); stroke: var(--border); }
    .heading { font-size: 22px; font-weight: 650; }
    .caption { font-size: 15px; fill: var(--muted); }
    .step { font-size: 16px; font-weight: 600; }
    .packet { fill: var(--sage); opacity: 0; }
    .diagram-label { font-size: 14px; font-weight: 600; }
    .azure-panel { --panel-accent: var(--blue); }
    .ionos-panel { --panel-accent: var(--sage); --edge-delay: -3s; }
    .llm-panel { --panel-accent: var(--lavender); --edge-delay: -6s; }
    .panel-edge { fill: none; stroke: var(--panel-accent); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 14 86; opacity: 0; }
    .azure-trace { fill: none; stroke: var(--blue); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 12 60; opacity: 0; }
    .vm-status { fill: var(--sage); opacity: .55; }
    .model-edge { fill: none; stroke: var(--model-accent); stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 35 100; opacity: 0; }
    .model-name { font-size: 12.5px; font-weight: 650; }
    .model-role { font-size: 10px; fill: var(--muted); }
    .voice-label { font-size: 11px; fill: var(--muted); }
    .voice-model { font-size: 11.5px; font-weight: 600; }

    @media (prefers-reduced-motion: no-preference) {
      .signal { animation: scroll-signal 12s linear infinite; }
      .packet { animation: route-alert 7s linear infinite; }
      .to-ticket { animation-delay: 2.2s; }
      .panel-edge { opacity: .85; animation: trace-panel-edge 9s linear infinite; animation-delay: var(--edge-delay, 0s); }
      .azure-trace { animation: provision-resources 7s linear infinite; }
      .vm-status { animation: vm-ready 8s ease-in-out infinite; }
      .model-edge { animation: trace-model-edge 6s linear infinite; animation-delay: var(--model-delay, 0s); }
      .second { animation-delay: .7s; }
      .third { animation-delay: 1.4s; }
    }

    @keyframes scroll-signal {
      to { transform: translateX(-288px); }
    }

    @keyframes route-alert {
      0%, 8% { opacity: 0; transform: translateX(0); }
      14%, 33% { opacity: 1; }
      40%, 100% { opacity: 0; transform: translateX(21px); }
    }

    @keyframes trace-panel-edge {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes provision-resources {
      0%, 12% { stroke-dashoffset: 12; opacity: 0; }
      18%, 49% { opacity: 1; }
      56%, 100% { stroke-dashoffset: -52; opacity: 0; }
    }

    @keyframes vm-ready {
      0%, 10%, 60%, 100% { opacity: .55; }
      26%, 45% { opacity: 1; }
    }

    @keyframes trace-model-edge {
      0% { stroke-dashoffset: 135; opacity: 0; }
      4%, 17% { opacity: 1; }
      24%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="var(--grid)"/>
    </pattern>
    <linearGradient id="backdrop">
      <stop stop-color="var(--background)"/>
      <stop offset="1" stop-color="var(--inset)"/>
    </linearGradient>
    <linearGradient id="plot-fill" x2="0" y2="1">
      <stop stop-color="var(--blue)" stop-opacity=".20"/>
      <stop offset="1" stop-color="var(--blue)" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mark-tile">
      <rect x="1.5" y="1.5" width="61" height="61" rx="9.3"/>
    </clipPath>
    <mask id="letter-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M30 52V20H37A8.5 8.5 0 0 1 37 37H30" fill="none" stroke="#000" stroke-width="9.5"/>
    </mask>
    <path id="metric" d="M0 43C15 43 21 51 36 50S58 30 75 37S96 44 111 31S128 12 147 20S169 41 186 31S205 9 223 17S247 39 263 37S278 43 288 43"/>
    <path id="logs" d="M0 57C15 57 20 61 36 59S55 48 73 52S95 58 111 50S132 39 147 44S165 56 183 52S203 38 221 42S245 55 262 54S276 57 288 57"/>
    <path id="metric-area" d="M0 43C15 43 21 51 36 50S58 30 75 37S96 44 111 31S128 12 147 20S169 41 186 31S205 9 223 17S247 39 263 37S278 43 288 43V68H0Z"/>
    <g id="vm-slot">
      <rect width="65" height="24" rx="5" fill="var(--surface)" stroke="var(--border)"/>
      <path d="M11 9H38M11 15H31" fill="none" stroke="var(--sage)" stroke-opacity=".65" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="495" rx="22" fill="url(#backdrop)"/>
  <rect width="1200" height="495" rx="22" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1199" height="494" rx="21.5" fill="none" stroke="var(--border)"/>

  <g transform="translate(55 43) scale(.84)">
    <rect x=".75" y=".75" width="62.5" height="62.5" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
    <path d="M8 0V64M16 0V64M24 0V64M32 0V64M40 0V64M48 0V64M56 0V64M0 8H64M0 16H64M0 24H64M0 32H64M0 40H64M0 48H64M0 56H64" clip-path="url(#mark-tile)" fill="none" stroke="var(--blue)" stroke-opacity=".18" stroke-width=".5"/>
    <g transform="translate(1.5 .5)" fill="none">
      <g stroke="var(--blue)" stroke-opacity=".52" stroke-width=".6" stroke-dasharray="1.6 1.4">
        <path d="M3 9H58M3 47H58M3 55H58"/>
        <circle cx="19" cy="20.5" r="8.5"/>
        <circle cx="37" cy="28.5" r="8.5"/>
      </g>
      <path d="M12 44V12H19A8.5 8.5 0 0 1 19 29H12" stroke="var(--text)" stroke-width="6" mask="url(#letter-gap)"/>
      <path d="M30 52V20H37A8.5 8.5 0 0 1 37 37H30" stroke="var(--sage)" stroke-width="6"/>
      <circle cx="46" cy="49" r="3.3" fill="var(--sage)"/>
    </g>
    <path d="M5 9V5H9M55 5H59V9M5 55V59H9M59 55V59H55" fill="none" stroke="var(--text)" stroke-opacity=".36" stroke-width=".8"/>
  </g>

  <text x="53" y="165" class="name">Paweł Piwowar</text>
  <text x="57" y="213" class="role">Cloud DevOps Engineer</text>
  <text x="57" y="267" class="career mono">Amiga → PC builds → IT support → SysAdmin → DevOps</text>

  <rect class="panel" x="623" y="42" width="326" height="150" rx="15"/>
  <path d="M643 42H678" stroke="var(--blue)" stroke-width="2" stroke-linecap="round"/>
  <text x="642" y="77" class="heading">Grafana</text>
  <text x="642" y="101" class="caption">Metrics and logs</text>
  <svg x="642" y="109" width="288" height="68" viewBox="0 0 288 68" overflow="hidden">
    <path d="M0 18H288M0 38H288M0 58H288M48 0V68M96 0V68M144 0V68M192 0V68M240 0V68" fill="none" stroke="var(--grid)" stroke-width="1"/>
    <g class="signal">
      <g fill="url(#plot-fill)">
        <use href="#metric-area"/><use href="#metric-area" x="288"/>
      </g>
      <g fill="none" stroke-linejoin="round">
        <g stroke="var(--blue)" stroke-width="2.25">
          <use href="#metric"/><use href="#metric" x="288"/>
        </g>
        <g stroke="var(--sage)" stroke-width="1.7" opacity=".7">
          <use href="#logs"/><use href="#logs" x="288"/>
        </g>
      </g>
    </g>
  </svg>

  <rect class="panel" x="961" y="42" width="185" height="150" rx="15"/>
  <path d="M981 42H1016" stroke="var(--warm)" stroke-width="2" stroke-linecap="round"/>
  <text x="980" y="77" class="heading">Terraform</text>
  <text x="980" y="101" class="caption">Cloud as code</text>
  <rect class="tile" x="980" y="118" width="46" height="46" rx="9"/>
  <g fill="none" stroke="var(--warm)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M998 130q-5 0-5 5v2q0 4-4 4 4 0 4 4v2q0 5 5 5m9-22q5 0 5 5v2q0 4 4 4-4 0-4 4v2q0 5-5 5"/>
    <path d="M1034 141H1064m-5-5 5 5-5 5" opacity=".65"/>
    <path d="M1086 153a8 8 0 0 1-.7-15.97 12 12 0 0 1 22.9-2.4 9.3 9.3 0 1 1 1.8 18.37Z"/>
  </g>

  <rect class="panel" x="623" y="205" width="523" height="89" rx="15"/>
  <path d="M643 205H678" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
  <text x="642" y="242" class="heading">n8n</text>
  <text x="642" y="266" class="caption">Workflows</text>
  <g fill="none" stroke="var(--sage)" stroke-opacity=".65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M870 250H895m-5-5 5 5-5 5"/>
    <path d="M997 250H1022m-5-5 5 5-5 5"/>
  </g>
  <circle class="packet" cx="873" cy="250" r="3"/>
  <circle class="packet to-ticket" cx="1000" cy="250" r="3"/>
  <rect class="tile" x="772" y="231" width="98" height="38" rx="9"/>
  <rect class="tile" x="899" y="231" width="98" height="38" rx="9"/>
  <rect class="tile" x="1026" y="231" width="98" height="38" rx="9"/>
  <g class="step" text-anchor="middle">
    <text x="821" y="256">Alert</text>
    <text x="948" y="256">Route</text>
    <text x="1075" y="256">Ticket</text>
  </g>

  <g class="azure-panel" transform="translate(54 316)">
    <rect class="panel" width="356" height="137" rx="15"/>
    <rect class="panel-edge" width="356" height="137" rx="15" pathLength="100"/>
    <path d="M19 0H54" stroke="var(--panel-accent)" stroke-width="2" stroke-linecap="round"/>
    <text x="19" y="35" class="heading">Azure</text>
    <text x="19" y="58" class="caption">Infrastructure as code</text>
    <rect class="tile" x="19" y="75" width="91" height="44" rx="9"/>
    <rect class="tile" x="166" y="75" width="171" height="44" rx="9"/>
    <g fill="none" stroke="var(--blue)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33 87H43L48 92V107H33ZM43 87V92H48M37 97H44M37 102H42"/>
      <path d="M110 97H160M155 92L160 97L155 102" opacity=".55"/>
      <rect x="180" y="88" width="17" height="18" rx="3"/>
      <path d="M184 94H193M184 100H191"/>
      <path d="M253 97H260V91H266M260 97V103H266"/>
      <circle cx="251" cy="97" r="2"/><circle cx="268" cy="91" r="2"/><circle cx="268" cy="103" r="2"/>
    </g>
    <path class="azure-trace" d="M112 97H158"/>
    <g class="diagram-label">
      <text x="57" y="102">Bicep</text>
      <text x="205" y="102">VM</text>
      <text x="279" y="102">VNet</text>
    </g>
  </g>

  <g class="ionos-panel" transform="translate(422 316)">
    <rect class="panel" width="356" height="137" rx="15"/>
    <rect class="panel-edge" width="356" height="137" rx="15" pathLength="100"/>
    <path d="M19 0H54" stroke="var(--panel-accent)" stroke-width="2" stroke-linecap="round"/>
    <text x="19" y="35" class="heading">IONOS Cloud</text>
    <text x="19" y="58" class="caption">Terraform and Ansible</text>
    <rect class="tile" x="19" y="75" width="318" height="44" rx="9"/>
    <path d="M104 97H250" fill="none" stroke="var(--sage)" stroke-opacity=".48" stroke-width="1.5" stroke-dasharray="3 4"/>
    <use href="#vm-slot" x="44" y="85"/><use href="#vm-slot" x="145" y="85"/><use href="#vm-slot" x="246" y="85"/>
    <circle class="vm-status" cx="97" cy="97" r="3"/>
    <circle class="vm-status second" cx="198" cy="97" r="3"/>
    <circle class="vm-status third" cx="299" cy="97" r="3"/>
  </g>

  <g class="llm-panel" transform="translate(790 316)">
    <rect class="panel" width="356" height="165" rx="15"/>
    <rect class="panel-edge" width="356" height="165" rx="15" pathLength="100"/>
    <path d="M19 0H54" stroke="var(--panel-accent)" stroke-width="2" stroke-linecap="round"/>
    <text x="19" y="35" class="heading">Local LLMs</text>
    <text x="19" y="56" class="caption">Running on an RTX 5080</text>
    <g class="local-model" transform="translate(19 66)" style="--model-accent: var(--lavender)">
      <rect class="tile" width="155" height="27" rx="5"/>
      <rect class="model-edge" width="155" height="27" rx="5" pathLength="100"/>
      <text class="model-name" x="8" y="12.5">Gemma 4 26B-A4B</text>
      <text class="model-role" x="8" y="23">Main model</text>
    </g>
    <g class="local-model" transform="translate(182 66)" style="--model-accent: var(--sage); --model-delay: 1.5s">
      <rect class="tile" width="155" height="27" rx="5"/>
      <rect class="model-edge" width="155" height="27" rx="5" pathLength="100"/>
      <text class="model-name" x="8" y="12.5">North Mini Code 1.0</text>
      <text class="model-role" x="8" y="23">Second candidate</text>
    </g>
    <g class="local-model" transform="translate(19 97)" style="--model-accent: var(--blue); --model-delay: 3s">
      <rect class="tile" width="155" height="27" rx="5"/>
      <rect class="model-edge" width="155" height="27" rx="5" pathLength="100"/>
      <text class="model-name" x="8" y="12.5">Mellum 4B</text>
      <text class="model-role" x="8" y="23">VS Code autocomplete</text>
    </g>
    <g class="local-model" transform="translate(182 97)" style="--model-accent: var(--warm); --model-delay: 4.5s">
      <rect class="tile" width="155" height="27" rx="5"/>
      <rect class="model-edge" width="155" height="27" rx="5" pathLength="100"/>
      <text class="model-name" x="8" y="12.5">Bielik 11B</text>
      <text class="model-role" x="8" y="23">Polish questions and notes</text>
    </g>
    <g class="voice-models">
      <text class="voice-label" x="19" y="138">Voice control · planned</text>
      <text class="voice-model" x="19" y="152">Whisper large-v3-turbo</text>
      <text class="voice-model" x="182" y="152">Granite 4.2 8B</text>
    </g>
  </g>
</svg>

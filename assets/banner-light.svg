<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
  <title id="title">Paweł Piwowar, Cloud DevOps Engineer. Cloud. Code. Curiosity.</title>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, Menlo, monospace; }
    .sweep { transform-origin: 960px 150px; animation: spin 7s linear infinite; }
    .blip { transform-box: fill-box; transform-origin: center; animation: blip 7s ease-out infinite; opacity: .25; }
    .b1 { animation-delay: -6.19s; } .b2 { animation-delay: -4.53s; } .b3 { animation-delay: -3.16s; }
    .b4 { animation-delay: -1.52s; } .b5 { animation-delay: -0.34s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blip { 0% { opacity: 1; transform: scale(1.7); } 30%, 100% { opacity: .25; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .sweep, .blip { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#dfe6e1"/></pattern>
    <radialGradient id="glow" cx="80%" cy="50%" r="45%"><stop offset="0" stop-color="#2f6e4a" stop-opacity=".08"/><stop offset="1" stop-color="#2f6e4a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#f3f5f2"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="17.5" fill="none" stroke="#cfd8d2"/>

  <g class="sans">
    <text x="64" y="92" class="mono" font-size="15" letter-spacing="3" fill="#2f6e4a">CLOUD DEVOPS ENGINEER</text>
    <text x="62" y="154" font-size="58" font-weight="700" fill="#1a2124" letter-spacing="-1">Paweł Piwowar</text>
    <text x="64" y="200" font-size="27" font-weight="600" fill="#3d484d">Cloud. Code. <tspan fill="#2f6e4a">Curiosity.</tspan></text>
    <text x="64" y="246" class="mono" font-size="14" fill="#56626a">hybrid cloud · infrastructure as code · observability · AI-assisted engineering</text>
  </g>

  <g fill="none" stroke="#cfd8d2" stroke-width="1.5">
    <circle cx="960" cy="150" r="40"/><circle cx="960" cy="150" r="80"/><circle cx="960" cy="150" r="120"/>
    <path d="M840 150H1080M960 30V270" stroke-opacity=".7"/>
  </g>
  <g class="sweep">
    <path d="M960 150L1080 150A120 120 0 0 0 1073.9 112.9Z" fill="#2f6e4a" fill-opacity=".28"/>
    <path d="M960 150L1073.9 112.9A120 120 0 0 0 1057.1 79.5Z" fill="#2f6e4a" fill-opacity=".12"/>
    <path d="M960 150H1080" stroke="#2f6e4a" stroke-width="2"/>
  </g>
  <g class="mono" font-size="12" fill="#56626a">
    <circle class="blip b1" cx="1012" cy="196" r="5" fill="#2f6e4a"/><text x="1022" y="214">Terraform</text>
    <circle class="blip b2" cx="912" cy="214" r="5" fill="#9a6b12"/><text x="846" y="236">Ansible</text>
    <circle class="blip b3" cx="890" cy="128" r="5" fill="#3f6f9a"/><text x="836" y="112">Azure</text>
    <circle class="blip b4" cx="978" cy="66" r="5" fill="#2f6e4a"/><text x="988" y="58">Grafana</text>
    <circle class="blip b5" cx="1050" cy="122" r="5" fill="#6b5a9a"/><text x="1062" y="110">AI</text>
  </g>
  <circle cx="960" cy="150" r="4" fill="#2f6e4a"/>
</svg>

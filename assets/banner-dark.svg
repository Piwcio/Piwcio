<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="336" viewBox="0 0 1200 336" role="img" aria-labelledby="title description">
  <title id="title">Paweł Piwowar · Cloud DevOps Engineer</title>
  <desc id="description">From Amiga and PC building through IT support and system administration to DevOps. An illustrated board shows Grafana metrics, Terraform and a workflow that routes an alert to a ticket in n8n.</desc>
  <style>
    svg {
      --background: #1b2420;
      --surface: #2b3631;
      --inset: #26332c;
      --text: #eff4ef;
      --muted: #c5cec9;
      --border: #4c5a53;
      --grid: #34443c;
      --sage: #9fd0ae;
      --blue: #adc9e1;
      --warm: #dfc49a;
    }

    text { font-family: Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: var(--text); }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .name { font-size: 71px; font-weight: 700; letter-spacing: -2.8px; }
    .role { font-size: 30px; font-weight: 600; fill: var(--sage); }
    .career { font-size: 16px; fill: var(--muted); }
    .panel { fill: var(--surface); fill-opacity: .86; stroke: var(--border); }
    .tile { fill: var(--inset); stroke: var(--border); }
    .heading { font-size: 22px; font-weight: 650; }
    .caption { font-size: 15px; fill: var(--muted); }
    .step { font-size: 16px; font-weight: 600; }
    .packet { fill: var(--sage); opacity: 0; }

    @media (prefers-reduced-motion: no-preference) {
      .signal { animation: scroll-signal 12s linear infinite; }
      .packet { animation: route-alert 7s linear infinite; }
      .to-ticket { animation-delay: 2.2s; }
    }

    @keyframes scroll-signal {
      to { transform: translateX(-288px); }
    }

    @keyframes route-alert {
      0%, 8% { opacity: 0; transform: translateX(0); }
      14%, 33% { opacity: 1; }
      40%, 100% { opacity: 0; transform: translateX(21px); }
    }
  </style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="var(--grid)"/>
    </pattern>
    <linearGradient id="backdrop">
      <stop stop-color="var(--background)"/>
      <stop offset="1" stop-color="var(--inset)"/>
    </linearGradient>
    <linearGradient id="plot-fill" x2="0" y2="1">
      <stop stop-color="var(--blue)" stop-opacity=".20"/>
      <stop offset="1" stop-color="var(--blue)" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mark-tile">
      <rect x="1.5" y="1.5" width="61" height="61" rx="9.3"/>
    </clipPath>
    <mask id="letter-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M30 52V20H37A8.5 8.5 0 0 1 37 37H30" fill="none" stroke="#000" stroke-width="9.5"/>
    </mask>
    <path id="metric" d="M0 43C15 43 21 51 36 50S58 30 75 37S96 44 111 31S128 12 147 20S169 41 186 31S205 9 223 17S247 39 263 37S278 43 288 43"/>
    <path id="logs" d="M0 57C15 57 20 61 36 59S55 48 73 52S95 58 111 50S132 39 147 44S165 56 183 52S203 38 221 42S245 55 262 54S276 57 288 57"/>
    <path id="metric-area" d="M0 43C15 43 21 51 36 50S58 30 75 37S96 44 111 31S128 12 147 20S169 41 186 31S205 9 223 17S247 39 263 37S278 43 288 43V68H0Z"/>
  </defs>

  <rect width="1200" height="336" rx="22" fill="url(#backdrop)"/>
  <rect width="1200" height="336" rx="22" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="1199" height="335" rx="21.5" fill="none" stroke="var(--border)"/>

  <g transform="translate(55 43) scale(.84)">
    <rect x=".75" y=".75" width="62.5" height="62.5" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
    <path d="M8 0V64M16 0V64M24 0V64M32 0V64M40 0V64M48 0V64M56 0V64M0 8H64M0 16H64M0 24H64M0 32H64M0 40H64M0 48H64M0 56H64" clip-path="url(#mark-tile)" fill="none" stroke="var(--blue)" stroke-opacity=".18" stroke-width=".5"/>
    <g transform="translate(1.5 .5)" fill="none">
      <g stroke="var(--blue)" stroke-opacity=".52" stroke-width=".6" stroke-dasharray="1.6 1.4">
        <path d="M3 9H58M3 47H58M3 55H58"/>
        <circle cx="19" cy="20.5" r="8.5"/>
        <circle cx="37" cy="28.5" r="8.5"/>
      </g>
      <path d="M12 44V12H19A8.5 8.5 0 0 1 19 29H12" stroke="var(--text)" stroke-width="6" mask="url(#letter-gap)"/>
      <path d="M30 52V20H37A8.5 8.5 0 0 1 37 37H30" stroke="var(--sage)" stroke-width="6"/>
      <circle cx="46" cy="49" r="3.3" fill="var(--sage)"/>
    </g>
    <path d="M5 9V5H9M55 5H59V9M5 55V59H9M59 55V59H55" fill="none" stroke="var(--text)" stroke-opacity=".36" stroke-width=".8"/>
  </g>

  <text x="53" y="165" class="name">Paweł Piwowar</text>
  <text x="57" y="213" class="role">Cloud DevOps Engineer</text>
  <text x="57" y="267" class="career mono">Amiga → PC builds → IT support → SysAdmin → DevOps</text>

  <rect class="panel" x="623" y="42" width="326" height="150" rx="15"/>
  <path d="M643 42H678" stroke="var(--blue)" stroke-width="2" stroke-linecap="round"/>
  <text x="642" y="77" class="heading">Grafana</text>
  <text x="642" y="101" class="caption">Metrics and logs</text>
  <svg x="642" y="109" width="288" height="68" viewBox="0 0 288 68" overflow="hidden">
    <path d="M0 18H288M0 38H288M0 58H288M48 0V68M96 0V68M144 0V68M192 0V68M240 0V68" fill="none" stroke="var(--grid)" stroke-width="1"/>
    <g class="signal">
      <g fill="url(#plot-fill)">
        <use href="#metric-area"/><use href="#metric-area" x="288"/>
      </g>
      <g fill="none" stroke-linejoin="round">
        <g stroke="var(--blue)" stroke-width="2.25">
          <use href="#metric"/><use href="#metric" x="288"/>
        </g>
        <g stroke="var(--sage)" stroke-width="1.7" opacity=".7">
          <use href="#logs"/><use href="#logs" x="288"/>
        </g>
      </g>
    </g>
  </svg>

  <rect class="panel" x="961" y="42" width="185" height="150" rx="15"/>
  <path d="M981 42H1016" stroke="var(--warm)" stroke-width="2" stroke-linecap="round"/>
  <text x="980" y="77" class="heading">Terraform</text>
  <text x="980" y="101" class="caption">Cloud as code</text>
  <rect class="tile" x="980" y="118" width="46" height="46" rx="9"/>
  <g fill="none" stroke="var(--warm)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M998 130q-5 0-5 5v2q0 4-4 4 4 0 4 4v2q0 5 5 5m9-22q5 0 5 5v2q0 4 4 4-4 0-4 4v2q0 5-5 5"/>
    <path d="M1034 141H1064m-5-5 5 5-5 5" opacity=".65"/>
    <path d="M1086 153a8 8 0 0 1-.7-15.97 12 12 0 0 1 22.9-2.4 9.3 9.3 0 1 1 1.8 18.37Z"/>
  </g>

  <rect class="panel" x="623" y="205" width="523" height="89" rx="15"/>
  <path d="M643 205H678" stroke="var(--sage)" stroke-width="2" stroke-linecap="round"/>
  <text x="642" y="242" class="heading">n8n</text>
  <text x="642" y="266" class="caption">Workflows</text>
  <g fill="none" stroke="var(--sage)" stroke-opacity=".65" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M870 250H895m-5-5 5 5-5 5"/>
    <path d="M997 250H1022m-5-5 5 5-5 5"/>
  </g>
  <circle class="packet" cx="873" cy="250" r="3"/>
  <circle class="packet to-ticket" cx="1000" cy="250" r="3"/>
  <rect class="tile" x="772" y="231" width="98" height="38" rx="9"/>
  <rect class="tile" x="899" y="231" width="98" height="38" rx="9"/>
  <rect class="tile" x="1026" y="231" width="98" height="38" rx="9"/>
  <g class="step" text-anchor="middle">
    <text x="821" y="256">Alert</text>
    <text x="948" y="256">Route</text>
    <text x="1075" y="256">Ticket</text>
  </g>
</svg>
